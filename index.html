<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa de Praia – Inventário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="card hidden">
    <h1>🏖️ Casa de Praia</h1>
    <p>Entre para ver o inventário.</p>
    <button id="btn-google">Entrar com Google</button>
    <div class="sep">ou</div>
    <form id="form-magic">
      <input type="email" id="magic-email" placeholder="seu e-mail" required>
      <button type="submit">Receber link por e-mail</button>
    </form>
    <p id="login-msg" class="msg"></p>
  </section>

  <section id="denied" class="card hidden">
    <h1>Acesso não autorizado</h1>
    <p>O e-mail <b id="denied-email"></b> não está na lista. Peça a um administrador para cadastrá-lo.</p>
    <button id="btn-logout-denied">Sair</button>
  </section>

  <div id="app" class="hidden">
    <header>
      <h1>🏖️ Casa de Praia</h1>
      <span><span id="who"></span> <button id="btn-logout" class="link">Sair</button></span>
    </header>
    <div class="layout">
      <nav id="spaces"></nav>
      <main id="people" class="hidden">
        <div class="toolbar">
          <h2>Pessoas</h2>
          <span id="people-count" class="count"></span>
        </div>
        <table class="people-table">
          <thead><tr><th>Nome</th><th>E-mail</th><th>Família</th><th>Responsável</th><th>Admin</th><th></th></tr></thead>
          <tbody id="people-list"></tbody>
        </table>
        <form id="form-person" class="add person-form">
          <input id="p-name" placeholder="Nome" required>
          <input id="p-email" type="email" placeholder="E-mail (o mesmo do login)" required>
          <select id="p-family" required></select>
          <label class="check"><input type="checkbox" id="p-resp"> Responsável</label>
          <label class="check"><input type="checkbox" id="p-admin"> Admin</label>
          <button type="submit">Cadastrar</button>
        </form>
        <p id="people-msg" class="msg"></p>
      </main>
      <main id="inventory">
        <div class="toolbar">
          <h2 id="space-title"></h2>
          <span id="item-count" class="count"></span>
          <span id="readonly-badge" class="badge hidden">somente leitura</span>
          <span id="edit-tools" class="hidden">
            <label class="btn secondary">Importar CSV <input type="file" id="csv-file" accept=".csv,text/csv" hidden></label>
          </span>
        </div>
        <table>
          <thead><tr><th>Descrição</th><th class="num">Qtd</th><th>Estado</th><th>Observações</th><th></th></tr></thead>
          <tbody id="items"></tbody>
        </table>
        <form id="form-add" class="add hidden">
          <input id="add-desc" placeholder="Novo item" required>
          <input id="add-qty" type="number" min="0" placeholder="Qtd">
          <button type="submit">Adicionar</button>
        </form>
        <p id="app-msg" class="msg"></p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
